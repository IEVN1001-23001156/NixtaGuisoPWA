<div>
  <div #contenedor [class]="'w-full rounded-2xl overflow-hidden z-0 ' + alto()"></div>
  @if (!soloLectura()) {
    <div class="mt-2 flex flex-wrap items-center justify-between gap-2">
      <p class="text-xs opacity-70">Toca el mapa para marcar el punto de entrega.</p>
      <button type="button" (click)="usarMiUbicacion()" [disabled]="buscandoGps()" class="btn-borde btn-chico">
        <span class="material-symbols-rounded text-lg">my_location</span>
        {{ buscandoGps() ? 'Buscando…' : 'Usar mi ubicación' }}
      </button>
    </div>
  }
  @if (mensaje()) { <p class="mt-1 error-campo">{{ mensaje() }}</p> }
</div>
