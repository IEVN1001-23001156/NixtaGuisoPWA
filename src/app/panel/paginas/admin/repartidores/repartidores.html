<h1 class="text-2xl lg:text-3xl font-extrabold">Repartidores</h1>
<section class="mt-4 grid gap-5 lg:grid-cols-[320px_1fr] lg:items-start">
  <form (ngSubmit)="guardar()" class="tarjeta grid gap-3">
    <h2 class="titulo-seccion">{{ editandoId() ? 'Editar repartidor' : 'Nuevo repartidor' }}</h2>
    <input class="campo-gris" [(ngModel)]="datos.nombre" name="nombre" placeholder="Nombre completo">
    <input class="campo-gris" [(ngModel)]="datos.telefono" name="telefono" maxlength="10" placeholder="Teléfono (10 dígitos)">
    <input class="campo-gris uppercase" [(ngModel)]="datos.placas" name="placas" maxlength="10" placeholder="Placas (ej. GTO-123-A)">
    <button class="btn-verde" [disabled]="!datos.nombre || !datos.telefono || !datos.placas">Guardar</button>
    @if (editandoId()) { <button type="button" (click)="cancelar()" class="btn-borde">Cancelar</button> }
  </form>
  <ul class="grid gap-3 sm:grid-cols-2">
    @for (r of repartidores(); track r.id_repartidor) {
      <li class="tarjeta p-4" [class.opacity-50]="!r.activo">
        <div class="flex items-center gap-3">
          <span class="w-11 h-11 rounded-full bg-nixta-dorado text-white grid place-items-center"><span class="material-symbols-rounded">two_wheeler</span></span>
          <div class="flex-1"><p class="font-bold">{{ r.nombre }}</p><p class="text-xs opacity-70">{{ r.telefono }} · {{ r.placas }}</p></div>
        </div>
        <p class="mt-2 text-sm">{{ r.pedidos_en_ruta }} pedido(s) en ruta</p>
        <div class="mt-3 flex gap-2">
          <button (click)="editar(r)" class="chip bg-nixta-naranja">Editar</button>
          <button (click)="alternar(r)" class="chip" [class]="r.activo ? 'chip bg-red-100 text-red-700' : 'chip bg-nixta-verde text-white'">{{ r.activo ? 'Desactivar' : 'Activar' }}</button>
        </div>
      </li>
    }
  </ul>
</section>
