<div class="min-h-screen bg-crema pb-24">
  <app-barra-superior (abrirMenu)="menuAbierto = true" />

  <div class="max-w-3xl mx-auto px-4 sm:px-5 lg:px-6 pt-6 lg:pt-8">
    <header class="bg-maiz px-5 pt-6 pb-7 rounded-t-[2rem] shadow-sm flex items-center gap-3">
      <a
        routerLink="/admin/menu"
        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-maiz shadow-sm hover:scale-105 transition shrink-0"
        aria-label="Volver a gestión de menú"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </a>

      <h1 class="text-xl lg:text-3xl font-extrabold text-cacao truncate">
        {{ esEdicion ? 'Editar Producto' : 'Nuevo Producto' }}
      </h1>
    </header>

    <main class="px-4 sm:px-5 lg:px-8 pt-6 bg-white rounded-b-[2rem] pb-8 shadow-xl border border-cacao/10">
      <form (submit)="guardarCambios($event)" class="space-y-4">
        <div class="p-4 rounded-2xl bg-crema border-l-4 border-milpa shadow-2xs flex flex-col sm:flex-row items-center gap-4">
          <div class="flex flex-col items-center gap-2 shrink-0">
            <img
              [src]="imagenSrc"
              alt="Producto"
              class="w-20 h-20 rounded-2xl object-cover bg-maiz/20 border border-cacao/15"
            />
            <label class="px-3 py-1 rounded-full bg-cacao text-crema text-[11px] font-bold cursor-pointer hover:opacity-90 transition whitespace-nowrap">
              Elegir foto
              <input
                type="file"
                accept="image/png,image/jpeg,image/webp"
                (change)="onSeleccionarArchivo($event)"
                class="hidden"
              />
            </label>
          </div>

          <div class="flex-1 min-w-0 w-full space-y-2.5">
            <input
              type="text"
              [(ngModel)]="nombre"
              name="nombre"
              placeholder="Nombre del producto"
              required
              class="w-full px-3 py-2 rounded-lg bg-white text-cacao text-sm border border-cacao/15 focus:outline-none"
            />
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <select
                [(ngModel)]="categoria"
                name="categoria"
                class="w-full min-w-0 px-3 py-2 rounded-lg bg-white text-cacao text-xs font-bold border border-cacao/15 focus:outline-none"
              >
                <option value="Tortillas">Tortillas</option>
                <option value="Guisados">Guisados</option>
                <option value="Aguas">Aguas</option>
                <option value="Salsas">Salsas</option>
                <option value="Lácteos">Lácteos</option>
              </select>
              <input
                type="text"
                [(ngModel)]="presentacion"
                name="presentacion"
                placeholder="Presentación (ej. 1 Kg, 1 Litro)"
                class="w-full min-w-0 px-3 py-2 rounded-lg bg-white text-cacao text-xs font-bold border border-cacao/15 focus:outline-none"
              />
            </div>
          </div>
        </div>

        <div class="p-4 rounded-2xl bg-crema border-l-4 border-milpa shadow-2xs grid grid-cols-1 sm:grid-cols-2 gap-4 text-center">
          <div class="min-w-0">
            <p class="text-xs font-extrabold text-cacao mb-1.5">Precio B2C</p>
            <input
              type="number"
              min="0"
              step="0.5"
              [(ngModel)]="precioB2c"
              name="precioB2c"
              placeholder="$0.00"
              required
              class="w-full px-3 py-2 rounded-lg bg-white text-cacao text-sm font-bold text-center border border-cacao/15 focus:outline-none"
            />
          </div>
          <div class="min-w-0">
            <p class="text-xs font-extrabold text-cacao mb-1.5">Precio B2B</p>
            <input
              type="number"
              min="0"
              step="0.5"
              [(ngModel)]="precioB2b"
              name="precioB2b"
              placeholder="$0.00"
              required
              class="w-full px-3 py-2 rounded-lg bg-white text-cacao text-sm font-bold text-center border border-cacao/15 focus:outline-none"
            />
          </div>
        </div>

        <div class="p-4 rounded-2xl bg-crema border-l-4 border-milpa shadow-2xs">
          <label class="block text-xs font-extrabold text-cacao mb-1.5">Descripción</label>
          <textarea
            rows="3"
            [(ngModel)]="descripcion"
            name="descripcion"
            placeholder="Describe el producto..."
            class="w-full px-3 py-2 rounded-lg bg-white text-cacao text-sm border border-cacao/15 focus:outline-none"
          ></textarea>
        </div>

        @if (errorMensaje()) {
          <p class="text-xs font-bold text-salsa px-1">{{ errorMensaje() }}</p>
        }

        <div class="pt-2 flex justify-center">
          <button
            type="submit"
            [disabled]="guardando()"
            class="px-8 py-3.5 rounded-full bg-milpa text-white text-sm lg:text-base font-extrabold shadow-md hover:bg-milpa/90 disabled:opacity-60 transition cursor-pointer"
          >
            {{ guardando() ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
        </div>
      </form>
    </main>
  </div>

  <app-menu-lateral [abierto]="menuAbierto" (cerrar)="menuAbierto = false" />
</div>
