<div class="min-h-screen bg-crema pb-24">
  <app-barra-superior (abrirMenu)="menuAbierto = true" />

  <div class="max-w-4xl mx-auto px-5 lg:px-6 pt-6 lg:pt-10">
    <div class="rounded-[2rem] overflow-hidden shadow-xl border border-cacao/10 bg-crema lg:grid lg:grid-cols-12">
      <div class="bg-maiz px-6 pt-7 pb-8 lg:col-span-5 lg:p-10 lg:flex lg:flex-col lg:justify-between">
        <div>
          <a
            routerLink="/checkout/entrega"
            class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-maiz shadow-sm hover:scale-105 transition mb-5"
            aria-label="Volver a dirección de entrega"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </a>

          <h1 class="text-2xl lg:text-3xl font-extrabold text-white tracking-tight">Método de Pago</h1>
          <p class="text-xs lg:text-sm text-white/90 mt-2">
            Solo se acepta pago con tarjeta.
          </p>
        </div>

        @if (carritoService.total() > 0) {
          <div class="mt-6 p-4 rounded-2xl bg-white/15 text-white">
            <span class="block text-xs font-bold opacity-85">Total a pagar</span>
            <span class="text-2xl font-black">${{ carritoService.total() }} MXN</span>
          </div>
        }
      </div>

      <div class="px-6 pt-7 pb-9 lg:col-span-7 lg:p-10 lg:flex lg:flex-col lg:justify-center">
        <div class="space-y-4 max-w-lg w-full mx-auto">
          <button
            type="button"
            (click)="metodoSeleccionado = 'tarjeta'"
            class="w-full p-4 rounded-2xl bg-white border-2 border-milpa text-left flex items-center justify-between transition cursor-pointer"
          >
            <div>
              <p class="text-sm lg:text-base font-extrabold text-cacao">Tarjeta</p>
              <p class="text-xs text-cacao/65">Pago con tarjeta de débito o crédito</p>
            </div>
            <span class="w-5 h-5 rounded-full border-2 border-milpa flex items-center justify-center">
              <span class="w-2.5 h-2.5 rounded-full bg-milpa"></span>
            </span>
          </button>

          @if (errorMensaje()) {
            <p class="text-xs font-bold text-salsa px-1">{{ errorMensaje() }}</p>
          }

          <div class="pt-4">
            <button
              type="button"
              [disabled]="enviando()"
              (click)="confirmarPedido()"
              class="w-full py-4 rounded-full bg-milpa text-white font-bold text-base lg:text-lg shadow-md hover:bg-milpa/90 disabled:opacity-60 transition cursor-pointer"
            >
              {{ enviando() ? 'Registrando pedido...' : 'Confirmar pedido' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-menu-lateral [abierto]="menuAbierto" (cerrar)="menuAbierto = false" />
  <app-barra-inferior />
</div>
