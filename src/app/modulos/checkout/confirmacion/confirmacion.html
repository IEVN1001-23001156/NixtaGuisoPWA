<div class="min-h-screen bg-crema pb-24">
  <app-barra-superior (abrirMenu)="menuAbierto = true" />

  <div class="flex flex-col items-center justify-center p-6 pt-8">
    <div class="w-full max-w-lg bg-white rounded-[2.5rem] p-8 lg:p-10 shadow-xl border border-cacao/10 text-center">
      <div class="w-24 h-24 rounded-full bg-milpa/15 mx-auto flex items-center justify-center mb-5">
        <img src="/Isotipo.png" alt="Pedido confirmado" class="w-16 h-16 object-contain" />
      </div>

      <span class="inline-block px-4 py-1 rounded-full bg-maiz/30 text-cacao text-xs font-extrabold mb-2">
        Folio {{ folio }}
      </span>
      <h1 class="text-2xl lg:text-3xl font-extrabold text-cacao">¡Pedido Registrado!</h1>
      <p class="text-sm lg:text-base text-cacao/75 mt-2">
        Tu solicitud está registrada.
      </p>

      @if (total !== null) {
        <div class="mt-5 p-4 rounded-2xl bg-crema border border-cacao/10 text-left space-y-1">
          <p class="text-xs font-bold text-cacao/70">Total de la orden: <span class="text-cacao font-black">${{ total }} MXN</span></p>
          @if (direccionResumen) {
            <p class="text-xs font-bold text-cacao/70">Entrega: <span class="text-cacao">{{ direccionResumen }}</span></p>
          }
        </div>
      }

      <div class="mt-8 flex flex-col sm:flex-row gap-3">
        <a
          routerLink="/rastreo"
          class="flex-1 py-3.5 px-5 rounded-full bg-milpa text-white font-bold text-sm lg:text-base hover:bg-milpa/90 transition"
        >
          Rastrear pedido
        </a>
        <a
          routerLink="/historial-pedidos"
          class="flex-1 py-3.5 px-5 rounded-full bg-cacao text-crema font-bold text-sm lg:text-base hover:bg-cacao/85 transition"
        >
          Ver historial
        </a>
        <a
          routerLink="/inicio"
          class="flex-1 py-3.5 px-5 rounded-full bg-milpa text-white font-bold text-sm lg:text-base hover:bg-milpa/90 transition"
        >
          Volver al inicio
        </a>
      </div>
    </div>
  </div>

  <app-menu-lateral [abierto]="menuAbierto" (cerrar)="menuAbierto = false" />
  <app-barra-inferior />
</div>
