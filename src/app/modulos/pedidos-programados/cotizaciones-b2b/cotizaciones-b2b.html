<div class="min-h-screen bg-crema pb-24">
  <app-barra-superior (abrirMenu)="menuAbierto = true" />

  <div class="max-w-4xl mx-auto px-5 lg:px-6 pt-6 lg:pt-10">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex items-center gap-3">
        <a
          routerLink="/programados"
          class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-cacao shadow-xs border border-cacao/10 hover:scale-105 transition shrink-0"
          aria-label="Volver a calendario de agendamiento"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </a>
        <h1 class="text-xl lg:text-3xl font-extrabold text-cacao">Cotizar evento</h1>
      </div>

      <a
        routerLink="/programados/nuevo"
        class="px-3.5 py-1.5 rounded-full bg-white text-cacao text-xs font-bold border border-cacao/15 hover:bg-maiz/20 transition"
      >
        Pedido especial
      </a>
    </div>

    <main class="lg:bg-white lg:rounded-[2rem] lg:p-8 lg:shadow-xl lg:border lg:border-cacao/10">
      <form (submit)="solicitarCotizacion($event)" class="p-5 rounded-3xl bg-white lg:bg-crema border border-cacao/10 space-y-4">

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Nombre del evento o negocio (opcional)</label>
          <input
            type="text"
            [(ngModel)]="nombreNegocio"
            name="nombreNegocio"
            placeholder="Ej. Cumpleaños de Sofía, Taquería Don Pepe"
            class="w-full px-4 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Productos para tu evento</label>

          <div class="space-y-2.5">
            @for (linea of lineas; track $index; let i = $index) {
              <div class="flex gap-2 items-center">
                <select
                  [(ngModel)]="linea.idProducto"
                  (ngModelChange)="normalizarLinea(i)"
                  [name]="'producto' + i"
                  class="flex-1 min-w-0 px-4 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
                >
                  @for (p of productosDisponibles(); track p.id) {
                    <option [ngValue]="p.id">{{ p.nombre }} — ${{ p.precio }} MXN ({{ p.unidad }})</option>
                  }
                </select>
                <input
                  type="number"
                  [min]="minimoLinea(i)"
                  [step]="pasoLinea(i)"
                  [(ngModel)]="linea.cantidad"
                  (ngModelChange)="errorMensaje.set('')"
                  (blur)="normalizarLinea(i)"
                  [name]="'cantidad' + i"
                  aria-label="Cantidad"
                  class="w-24 px-3 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm text-center border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
                />
                @if (lineas.length > 1) {
                  <button
                    type="button"
                    (click)="quitarLinea(i)"
                    aria-label="Quitar producto"
                    class="w-10 h-10 shrink-0 rounded-full bg-red-50 text-red-600 font-black hover:bg-red-100 transition"
                  >
                    ✕
                  </button>
                }
              </div>
            }
          </div>

          <div class="mt-3 flex items-center justify-between gap-3">
            <button
              type="button"
              (click)="agregarLinea()"
              class="px-4 py-2 rounded-full bg-maiz/30 text-cacao text-xs font-bold hover:bg-maiz/50 transition"
            >
              + Agregar otro producto
            </button>
            <span class="text-sm font-extrabold text-cacao">Estimado: ${{ totalEstimado }} MXN</span>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-cacao mb-1 ml-1">Fecha del evento</label>
            <input
              type="date"
              [(ngModel)]="fechaRequerida"
              name="fechaRequerida"
              required
              class="w-full px-4 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-cacao mb-1 ml-1">Hora de entrega</label>
            <input
              type="time"
              [(ngModel)]="horaEntrega"
              name="horaEntrega"
              required
              class="w-full px-4 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Dirección de entrega</label>
          <input
            type="text"
            [(ngModel)]="direccionEntrega"
            name="direccionEntrega"
            placeholder="Calle, número y colonia"
            required
            class="w-full px-4 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Detalles adicionales</label>
          <textarea
            rows="3"
            [(ngModel)]="notas"
            name="notas"
            placeholder="Número de invitados, tipo de evento, empaque o condiciones especiales"
            class="w-full px-4 py-3 rounded-xl bg-crema lg:bg-white text-cacao text-sm border border-cacao/15 focus:outline-none focus:ring-2 focus:ring-maiz"
          ></textarea>
        </div>

        @if (errorMensaje()) {
          <p class="rounded-2xl bg-red-50 border border-red-200 px-4 py-2.5 text-xs font-bold text-red-700">{{ errorMensaje() }}</p>
        }

        @if (mensajeEstado()) {
          <p class="text-xs font-bold text-milpa px-1">{{ mensajeEstado() }}</p>
        }

        <button
          type="submit"
          [disabled]="enviando()"
          class="w-full sm:w-auto px-7 py-3.5 rounded-full bg-milpa text-white text-sm font-bold shadow hover:bg-milpa/90 disabled:opacity-60 transition cursor-pointer"
        >
          {{ enviando() ? 'Verificando y enviando...' : 'Solicitar cotización' }}
        </button>
      </form>
    </main>
  </div>

  <app-menu-lateral [abierto]="menuAbierto" (cerrar)="menuAbierto = false" />
  <app-barra-inferior />
</div>
