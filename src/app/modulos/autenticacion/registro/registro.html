<div class="min-h-screen bg-maiz flex flex-col lg:items-center lg:justify-center lg:p-6">
  <div class="w-full flex-1 flex flex-col lg:flex-initial lg:max-w-4xl lg:grid lg:grid-cols-12 lg:rounded-[2.5rem] lg:overflow-hidden lg:shadow-2xl lg:bg-crema">
    <div class="bg-maiz px-6 pt-7 pb-8 lg:col-span-5 lg:p-10 lg:flex lg:flex-col lg:justify-between">
      <div>
        <a
          routerLink="/login"
          class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-maiz shadow-sm hover:scale-105 transition mb-5"
          aria-label="Volver a iniciar sesión"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </a>


        <h1 class="text-2xl lg:text-3xl font-extrabold text-white tracking-tight">
          Crear Cuenta
        </h1>
      </div>

      <div class="hidden lg:block mt-8">
        <img src="/Logotipo.png" alt="NixtaGuiso" class="w-36 h-36 object-contain opacity-85" />
      </div>
    </div>

    <div class="flex-1 bg-crema rounded-t-[2rem] lg:rounded-none px-6 pt-7 pb-10 lg:col-span-7 lg:p-10 lg:flex lg:flex-col lg:justify-center">
      <form (submit)="registrar($event)" class="space-y-3.5 max-w-lg w-full mx-auto">
        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            (click)="tipo = 'B2C'"
            class="py-3 rounded-xl text-xs lg:text-sm font-extrabold border transition cursor-pointer"
            [class.bg-milpa]="tipo === 'B2C'"
            [class.text-white]="tipo === 'B2C'"
            [class.border-milpa]="tipo === 'B2C'"
            [class.bg-white]="tipo !== 'B2C'"
            [class.text-cacao]="tipo !== 'B2C'"
            [class.border-cacao/15]="tipo !== 'B2C'"
          >
            Hogar
          </button>

          <button
            type="button"
            (click)="tipo = 'B2B'"
            class="py-3 rounded-xl text-xs lg:text-sm font-extrabold border transition cursor-pointer"
            [class.bg-milpa]="tipo === 'B2B'"
            [class.text-white]="tipo === 'B2B'"
            [class.border-milpa]="tipo === 'B2B'"
            [class.bg-white]="tipo !== 'B2B'"
            [class.text-cacao]="tipo !== 'B2B'"
            [class.border-cacao/15]="tipo !== 'B2B'"
          >
            Negocio
          </button>
        </div>

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Nombre completo</label>
          <input
            type="text"
            [(ngModel)]="nombre"
            name="nombre"
            placeholder="Tu nombre completo"
            required
            class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <div>
            <label class="block text-xs font-bold text-cacao mb-1 ml-1">Correo electrónico</label>
            <input
              type="email"
              [(ngModel)]="correo"
              name="correo"
              placeholder="correo@ejemplo.com"
              required
              class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-cacao mb-1 ml-1">Teléfono (10 dígitos)</label>
            <input
              type="tel"
              [(ngModel)]="telefono"
              name="telefono"
              placeholder="4771234567"
              required
              class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Contraseña</label>
          <input
            type="password"
            [(ngModel)]="contrasena"
            name="contrasena"
            placeholder="Mínimo 8 caracteres"
            required
            class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        @if (tipo === 'B2B') {
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div>
              <label class="block text-xs font-bold text-cacao mb-1 ml-1">Nombre del negocio</label>
              <input
                type="text"
                [(ngModel)]="nombreNegocio"
                name="nombreNegocio"
                placeholder="Lonchería / Cocina"
                required
                class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
              />
            </div>

            <div>
              <label class="block text-xs font-bold text-cacao mb-1 ml-1">RFC (opcional)</label>
              <input
                type="text"
                [(ngModel)]="rfc"
                name="rfc"
                placeholder="XAXX010101000"
                class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
              />
            </div>
          </div>
        }

        <div>
          <label class="block text-xs font-bold text-cacao mb-1 ml-1">Dirección (opcional)</label>
          <input
            type="text"
            [(ngModel)]="direccion"
            name="direccion"
            placeholder="Calle, número y colonia"
            class="w-full px-4 py-3 rounded-xl bg-white text-cacao text-sm border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        @if (errorMensaje()) {
          <p class="text-xs font-bold text-salsa px-1">{{ errorMensaje() }}</p>
        }

        <div class="pt-2">
          <button
            type="submit"
            [disabled]="cargando()"
            class="w-full py-4 rounded-full bg-milpa text-white font-bold text-base lg:text-lg shadow-md hover:bg-milpa/90 disabled:opacity-60 transition cursor-pointer"
          >
            {{ cargando() ? 'Creando cuenta...' : 'Registrarme' }}
          </button>
        </div>

        <p class="text-center text-xs lg:text-sm text-cacao/75 pt-2">
          ¿Ya tienes cuenta?
          <a routerLink="/iniciar-sesion" class="font-extrabold text-salsa hover:underline">
            Inicia sesión
          </a>
          <p class="text-center text-xs lg:text-xs text-cacao/75 pt-1"> 
            Para registrar un administrador contacta a nixtaguiso@gmail.com
        </p>
      </form>
    </div>
  </div>
</div>
