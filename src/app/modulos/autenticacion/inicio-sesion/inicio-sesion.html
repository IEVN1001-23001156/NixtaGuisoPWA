<div class="min-h-screen bg-maiz flex flex-col lg:items-center lg:justify-center lg:p-8">
  <div class="w-full flex-1 flex flex-col lg:flex-initial lg:max-w-4xl lg:grid lg:grid-cols-12 lg:rounded-[2.5rem] lg:overflow-hidden lg:shadow-2xl lg:bg-crema">
    <div class="bg-maiz px-6 pt-8 pb-8 lg:col-span-5 lg:p-12 lg:flex lg:flex-col lg:justify-between">
      <div>
        <a
          routerLink="/inicio"
          class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-maiz shadow-sm hover:scale-105 transition mb-5"
          aria-label="Volver al inicio"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </a>


        <h1 class="text-2xl lg:text-4xl font-extrabold text-white tracking-tight">
          Iniciar Sesión
        </h1>
      </div>

      <div class="hidden lg:block mt-8">
        <img src="/Logotipo.png" alt="NixtaGuiso" class="w-36 h-36 object-contain opacity-85" />
      </div>
    </div>

    <div class="flex-1 bg-crema rounded-t-[2rem] lg:rounded-none px-6 pt-8 pb-10 lg:col-span-7 lg:p-12 lg:flex lg:flex-col lg:justify-center">
      <form (submit)="iniciarSesion($event)" class="space-y-4 max-w-md w-full mx-auto">
        <div>
          <label class="block text-xs lg:text-sm font-bold text-cacao mb-1.5 ml-1">Correo electrónico</label>
          <input
            type="email"
            [(ngModel)]="correo"
            name="correo"
            placeholder="correo@ejemplo.com"
            required
            class="w-full px-4 py-3.5 rounded-xl bg-white text-cacao text-sm lg:text-base border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5 ml-1">
            <label class="block text-xs lg:text-sm font-bold text-cacao">Contraseña</label>
            <a routerLink="/recuperar-contrasena" class="text-xs font-bold text-salsa hover:underline">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          <input
            type="password"
            [(ngModel)]="contrasena"
            name="contrasena"
            placeholder="Tu contraseña"
            required
            class="w-full px-4 py-3.5 rounded-xl bg-white text-cacao text-sm lg:text-base border border-cacao/10 focus:outline-none focus:ring-2 focus:ring-maiz"
          />
        </div>

        @if (errorMensaje()) {
          <p class="text-xs font-bold text-salsa px-1">{{ errorMensaje() }}</p>
        }

        <div class="pt-2 space-y-3">
          <button
            type="submit"
            [disabled]="cargando()"
            class="w-full py-4 rounded-full bg-milpa text-white font-bold text-base lg:text-lg shadow-md hover:bg-milpa/90 disabled:opacity-60 transition cursor-pointer"
          >
            {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
          </button>

          <button
            type="button"
            (click)="continuarComoInvitado()"
            class="w-full py-3.5 rounded-full bg-white text-cacao font-bold text-sm lg:text-base border border-cacao/20 hover:bg-white/80 transition cursor-pointer"
          >
            Continuar como invitado
          </button>
        </div>

        <p class="text-center text-xs lg:text-sm text-cacao/75 pt-3">
          ¿No tienes cuenta?
          <a routerLink="/registro" class="font-extrabold text-salsa hover:underline">
            Regístrate aquí
          </a>
        </p>
      </form>
    </div>
  </div>
</div>
