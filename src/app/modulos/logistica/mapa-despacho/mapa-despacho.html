<div class="min-h-screen bg-crema pb-24">
  <app-barra-superior (abrirMenu)="menuAbierto = true" />

  <div class="max-w-5xl mx-auto px-5 lg:px-6 pt-6 lg:pt-8">
    <header class="bg-maiz px-5 pt-6 pb-7 rounded-t-[2rem] shadow-sm flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <a
          routerLink="/admin/panel"
          class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-maiz shadow-sm hover:scale-105 transition"
          aria-label="Volver al panel operativo"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </a>

        <h1 class="text-xl lg:text-3xl font-extrabold text-cacao">Logística y Despacho</h1>
      </div>

      <a
        routerLink="/rastreo"
        class="px-4 py-2 rounded-full bg-cacao text-crema text-xs font-extrabold hover:bg-cacao/85 transition"
      >
        Rastreo en vivo
      </a>
    </header>

    <main class="px-5 lg:px-8 pt-6 bg-white rounded-b-[2rem] pb-8 shadow-xl border border-cacao/10 space-y-5">
      <div class="rounded-3xl bg-crema border border-cacao/10 overflow-hidden shadow-xs">
        <div class="px-4 py-2.5 bg-crema border-b border-cacao/10 flex flex-wrap items-center justify-between gap-2">
          <span class="px-3 py-1 rounded-full bg-maiz/40 text-cacao text-xs font-extrabold">
            Mapa de Rutas · León, Gto.
          </span>
          <span class="text-xs font-bold text-cacao/80">{{ resumenRuta() }}</span>
        </div>

        <div #mapaDespachoEl class="h-64 lg:h-80 w-full z-0"></div>
      </div>

      <div class="space-y-3">
        <h2 class="text-sm lg:text-base font-extrabold text-cacao">Pedidos en Ruta</h2>

        @for (pedido of pedidos(); track pedido.id) {
          <div
            (click)="seleccionarYVerRuta(pedido)"
            class="p-4 rounded-2xl bg-crema border border-cacao/10 shadow-2xs flex items-center justify-between gap-4 hover:border-maiz transition cursor-pointer"
          >
            <div class="flex items-center gap-3.5">
              <div class="w-20 h-20 rounded-2xl bg-maiz flex flex-col items-center justify-center text-cacao shrink-0 p-2 text-center">
                <span class="text-xs font-black">{{ pedido.hora }}</span>
                <span class="text-[11px] font-bold opacity-80">{{ pedido.fecha }}</span>
              </div>

              <div>
                <h3 class="text-sm lg:text-base font-extrabold text-cacao">{{ pedido.cliente }}</h3>
                <p class="text-xs text-cacao/70 mt-0.5">{{ pedido.detalle }}</p>
              </div>
            </div>

            <button
              type="button"
              (click)="$event.stopPropagation(); asignarPedido(pedido)"
              class="px-4 py-2 rounded-full text-xs font-extrabold text-white transition cursor-pointer shrink-0"
              [class.bg-milpa]="!pedido.asignado"
              [class.bg-cacao]="pedido.asignado"
            >
              {{ pedido.asignado ? 'En Ruta' : 'Asignar' }}
            </button>
          </div>
        } @empty {
          <div class="p-6 rounded-2xl bg-crema border border-cacao/10 text-center">
            <p class="text-sm font-bold text-cacao/75">No hay pedidos registrados para despacho.</p>
          </div>
        }
      </div>
    </main>
  </div>

  <app-menu-lateral [abierto]="menuAbierto" (cerrar)="menuAbierto = false" />
</div>
