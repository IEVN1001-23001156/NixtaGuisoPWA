@if (abierto) {
  <div class="fixed inset-0 z-50 flex">
    <button
      type="button"
      (click)="cerrarMenu()"
      class="fixed inset-0 bg-cacao/45 backdrop-blur-[1px] cursor-pointer"
      aria-label="Cerrar menú"
    ></button>

    <aside class="relative z-10 w-72 sm:w-80 max-w-[85vw] h-full bg-crema shadow-2xl border-r border-cacao/10 flex flex-col justify-between px-6 py-7 overflow-y-auto">
      <div>
        <div class="relative flex items-center justify-center pt-1 pb-6 border-b border-cacao/10">
          <img
            src="/Logotipo.png"
            alt="NixtaGuiso"
            class="h-20 sm:h-24 w-auto object-contain select-none"
          />

          <button
            type="button"
            (click)="cerrarMenu()"
            class="absolute right-0 top-0 inline-flex items-center justify-center w-9 h-9 rounded-full bg-white text-cacao shadow-xs border border-cacao/10 hover:scale-105 transition cursor-pointer"
            aria-label="Cerrar menú"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        @if (esAdmin()) {
          <nav class="mt-6 flex flex-col space-y-2">
            <a
              routerLink="/admin/panel"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Panel operativo
            </a>

            <a
              routerLink="/admin/menu"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Gestión de menú
            </a>

            <a
              routerLink="/admin/inventario"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Inventario e insumos
            </a>

            <a
              routerLink="/admin/logistica"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Logística y entregas
            </a>

            <a
              routerLink="/admin/crm"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Clientes CRM
            </a>

            <a
              routerLink="/perfil"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Mi perfil
            </a>
          </nav>
        } @else {
          <nav class="mt-6 flex flex-col space-y-2">
            <a
              routerLink="/perfil"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Configuración
            </a>

            <a
              routerLink="/cotizaciones-b2b"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Cotizar evento
            </a>

            <a
              routerLink="/programados"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Pedidos programados
            </a>

            <a
              routerLink="/historial-pedidos"
              (click)="cerrarMenu()"
              class="px-4 py-3 rounded-2xl text-base font-extrabold text-cacao hover:bg-maiz/20 transition"
            >
              Historial de pedidos
            </a>
          </nav>
        }
      </div>

      <div class="pt-6 border-t border-cacao/10">
        <button
          type="button"
          (click)="cerrarSesion()"
          class="w-full px-4 py-3 rounded-2xl text-left text-base font-extrabold text-salsa hover:bg-salsa/10 transition cursor-pointer"
        >
          Cerrar sesión
        </button>
      </div>
    </aside>
  </div>
}
